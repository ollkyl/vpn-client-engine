name: 'Deploy workflow (Linux only)'

on:
  push:
    branches:
      - '**'

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/ # https://download.qt.io/static/mirrorlist/

jobs:
  Detect-Changes:
    runs-on: ubuntu-latest
    outputs:
      recipes_changed: ${{ steps.filter.outputs.recipes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            recipes:
              - 'recipes/**'
              - 'conanfile.py'
              - '.github/workflows/deploy.yml'
              - 'cmake/conan_provider.cmake'
              - 'cmake/platform_settings.cmake'
              - 'cmake/recipes_bootstrap.cmake'

  Bake-Prebuilts-Linux:
    runs-on: ubuntu-22.04
    needs: Detect-Changes
    if: needs.Detect-Changes.outputs.recipes_changed == 'true'

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Build dependencies'
      shell: bash
      run: |
        for build_type in Release Debug; do
          cmake -S . -B build -DPREBUILTS_ONLY=1 "-DCMAKE_BUILD_TYPE=$build_type"
        done

    # Шаги логина/аплоада в приватный conan-remote Amnezia удалены —
    # у тебя в форке нет доступа к их серверу, и он тебе не нужен для локальной сборки.

# ------------------------------------------------------

  Build-Linux-Ubuntu:
    runs-on: ubuntu-22.04

    needs: Bake-Prebuilts-Linux
    if: ${{ always() }}

    env:
      QT_VERSION: 6.10.1
      QIF_VERSION: 4.7
      # Заглушки вместо секретов Amnezia. Если сборка требует непустые значения —
      # компилятор их получит, но реальный сервер, конечно, работать не будет.
      # Замени на свои значения через Settings → Secrets and variables → Actions,
      # если хочешь, чтобы клиент реально подключался к твоему серверу.
      PROD_AGW_PUBLIC_KEY: ${{ secrets.PROD_AGW_PUBLIC_KEY || 'dummy' }}
      PROD_S3_ENDPOINT: ${{ secrets.PROD_S3_ENDPOINT || 'https://example.invalid' }}
      FALLBACK_S3_ENDPOINT: ${{ secrets.FALLBACK_S3_ENDPOINT || 'https://example.invalid' }}
      DEV_AGW_PUBLIC_KEY: ${{ secrets.DEV_AGW_PUBLIC_KEY || 'dummy' }}
      DEV_AGW_ENDPOINT: ${{ secrets.DEV_AGW_ENDPOINT || 'https://example.invalid' }}
      DEV_S3_ENDPOINT: ${{ secrets.DEV_S3_ENDPOINT || 'https://example.invalid' }}
      FREE_V2_ENDPOINT: ${{ secrets.FREE_V2_ENDPOINT || 'https://example.invalid' }}
      PREM_V1_ENDPOINT: ${{ secrets.PREM_V1_ENDPOINT || 'https://example.invalid' }}

    steps:
    - name: 'Install Qt'
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qtremoteobjects qt5compat qtshadertools'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        tools: 'tools_ifw'
        set-env: 'true'
        aqtversion: '==3.3.0'
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Install system packages'
      run: sudo apt-get install libxkbcommon-x11-0 libsecret-1-dev

    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Build project'
      shell: bash
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
      run: deploy/build.sh --generator Ninja --installer all

    - name: 'Upload installer artifact'
      uses: actions/upload-artifact@v7
      with:
        path: deploy/build/AmneziaVPN_*_linux_x64.run
        archive: false
        retention-days: 7

    - name: 'Upload translations artifact'
      uses: actions/upload-artifact@v4
      with:
        name: AmneziaVPN_translations
        path: client/translations
        retention-days: 7